# Hot-reload development: bind-mount source + Django runserver + Vite.
#
# Usage:
#   bash scripts/compose/start.sh
#   # or:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Frontend (Vite on host): http://localhost:${FRONTEND_DEV_PORT:-4173} -> container :5173
# Ports are bound to 127.0.0.1 only so other devices on the LAN cannot reach dev by default.
# For phone/tablet testing: bash scripts/compose/publish-dev-to-lan.sh
# Backend (runserver): http://localhost:${BACKEND_PORT:-8000}
#
# Default host port matches prod FRONTEND_PORT (4173); do not run start-prod.sh and start.sh at once on the same machine without changing a port.

services:
  backend:
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput
        python manage.py seed_admin
        python manage.py seed_staff
        exec python manage.py runserver 0.0.0.0:8000
    environment:
      # Prefer CORS_DEV_ORIGINS (publish-dev-to-lan.sh exports it). Else CORS_ALLOWED_ORIGINS from .env — same keys many teams already use.
      CORS_ALLOWED_ORIGINS: ${CORS_DEV_ORIGINS:-${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_DEV_PORT:-4173},http://127.0.0.1:${FRONTEND_DEV_PORT:-4173},http://localhost:5173,http://127.0.0.1:5173}}
      FRONTEND_URL: ${FRONTEND_DEV_URL:-http://localhost:${FRONTEND_DEV_PORT:-4173}}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # Drop base file's ${FRONTEND_PORT}:80 (nginx) — only Vite listens in this image.
    ports: !override
      - "127.0.0.1:${FRONTEND_DEV_PORT:-4173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Vite runs on :5173 in-container; browser uses FRONTEND_DEV_PORT on the host — align HMR WebSocket with the mapped port.
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-local}
      VITE_DEV_PUBLISHED_PORT: ${FRONTEND_DEV_PORT:-4173}
      VITE_DEV_PROXY_TARGET: http://backend:8000
      # Silent staff login in the browser (Vite dev only). Set VITE_DEV_AUTO_LOGIN=false to use the login form.
      VITE_DEV_AUTO_LOGIN: ${VITE_DEV_AUTO_LOGIN:-true}
      VITE_DEV_LOGIN_EMAIL: ${VITE_DEV_LOGIN_EMAIL:-${ADMIN_EMAIL:-admin@autoservice.local}}
      VITE_DEV_LOGIN_PASSWORD: ${VITE_DEV_LOGIN_PASSWORD:-${ADMIN_PASSWORD:-admin12345}}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://127.0.0.1:5173/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  frontend_node_modules:
