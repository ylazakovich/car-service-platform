# Hot-reload development: bind-mount source + Django runserver + Vite.
#
# Usage:
#   bash scripts/start.sh
#   # or:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Frontend (Vite on host): http://localhost:${FRONTEND_DEV_PORT:-4173} -> container :5173
# Backend (runserver): http://localhost:${BACKEND_PORT:-8000}
#
# Default host port matches prod FRONTEND_PORT (4173); do not run start-prod.sh and start.sh at once on the same machine without changing a port.

services:
  backend:
    volumes:
      - ./backend:/app
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput
        python manage.py seed_admin
        python manage.py seed_staff
        python manage.py seed_e2e_data
        exec python manage.py runserver 0.0.0.0:8000
    environment:
      # When FRONTEND_DEV_PORT changes in .env, host origins follow unless CORS_DEV_ORIGINS is set explicitly.
      CORS_ALLOWED_ORIGINS: ${CORS_DEV_ORIGINS:-http://localhost:${FRONTEND_DEV_PORT:-4173},http://127.0.0.1:${FRONTEND_DEV_PORT:-4173},http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_URL: ${FRONTEND_DEV_URL:-http://localhost:${FRONTEND_DEV_PORT:-4173}}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # Drop base file's ${FRONTEND_PORT}:80 (nginx) — only Vite listens in this image.
    ports: !override
      - "127.0.0.1:${FRONTEND_DEV_PORT:-4173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://127.0.0.1:5173/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  frontend_node_modules:
