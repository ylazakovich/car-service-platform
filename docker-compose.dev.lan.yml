# Optional overlay: publish dev frontend + backend on all host interfaces (LAN / phone on same Wi‑Fi).
# Do not add this file to COMPOSE_FILE by default — use: bash scripts/compose/publish-dev-to-lan.sh
#
# VITE_LAN_DEV=1 — relax Vite dev `server.cors` so module requests with Origin http://<LAN>:port are not blocked
# (default CORS in Vite 8 only allows localhost-class origins; phones use the LAN IP in Origin).

services:
  backend:
    ports: !override
      - "${BACKEND_PORT:-8000}:8000"
  frontend:
    ports: !override
      - "${FRONTEND_DEV_PORT:-4173}:5173"
    environment:
      VITE_LAN_DEV: "1"
