name: PR Pipeline

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# Same PR = one group. Do not cancel in-progress runs: canceling mid-run drops some job artifacts;
# merged Allure would miss suites from jobs that had not finished uploading (misleading report).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # upload-artifact (Allure, JUnit, Playwright HTML)

jobs:
  frontend:
    name: "Frontend: Build & Test"
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-node

      - name: Build
        run: npm run build

      - name: Run tests
        run: npx vitest run

      - name: Allure CI env fragment (frontend)
        if: always()
        run: bash ../scripts/ci/write-allure-ci-env-fragment.sh Frontend allure-results
        working-directory: frontend

      - uses: ./.github/actions/junit-step-summary
        if: always()
        with:
          cwd: frontend
          variant: frontend-single
          title: Frontend Tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: frontend-test-results
          path: frontend/test-results/
          retention-days: 30

      - name: Upload Allure results (frontend)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: allure-results-frontend
          path: frontend/allure-results/
          if-no-files-found: ignore
          retention-days: 30

  backend:
    name: "Backend: Build & Test"
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements-test.txt

      - name: Check for missing migrations
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          TEST_OUTPUT_DIR: test-results
        run: |
          mkdir -p allure-results test-results
          pytest --alluredir=allure-results --junitxml=test-results/junit.xml -v

      - name: Allure CI env fragment (backend)
        if: always()
        run: bash ../scripts/ci/write-allure-ci-env-fragment.sh Backend allure-results
        working-directory: backend

      - uses: ./.github/actions/junit-step-summary
        if: always()
        with:
          cwd: backend
          variant: backend-pytest
          title: Backend Tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: backend-test-results
          path: backend/test-results/
          retention-days: 30

      - name: Upload Allure results (backend)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: allure-results-backend
          path: backend/allure-results/
          if-no-files-found: ignore
          retention-days: 30

  e2e:
    name: "End-to-end"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      E2E_ADMIN_EMAIL: admin@autoservice.local
      E2E_ADMIN_PASSWORD: admin12345
      E2E_STAFF_EMAIL: staff@autoservice.local
      E2E_STAFF_PASSWORD: staff12345
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-node

      - name: Cache Playwright browsers
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - uses: ./.github/actions/compose-up
        with:
          env-profile: json-info
          wait-for-frontend: "true"
          wait-for-api-health: "true"
          api-health-url: "http://127.0.0.1:4173/api/health"
          # Fork PRs: token is read-only — GHA cache backend needs actions: write
          github-actions-cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'true' || 'false' }}

      - name: Run Playwright
        working-directory: frontend
        run: |
          mkdir -p allure-results test-results
          npx playwright test

      - uses: ./.github/actions/junit-step-summary
        if: always()
        with:
          cwd: frontend
          variant: e2e-playwright
          title: End-to-end

      - name: Allure CI env fragment (E2E)
        if: always()
        run: bash scripts/ci/write-allure-ci-env-fragment.sh E2E frontend/allure-results

      - name: Upload Allure results (E2E)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: allure-results-e2e
          path: frontend/allure-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload E2E JUnit (Playwright)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: e2e-test-results
          path: frontend/test-results/e2e-junit.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Collect Docker logs
        if: always()
        run: |
          mkdir -p docker-logs
          for service in backend frontend db; do
            container_id=$(docker compose ps -q "$service" 2>/dev/null || true)
            if [ -n "$container_id" ]; then
              docker logs "$container_id" > "docker-logs/${service}.log" 2>&1 || true
            fi
          done

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: docker-logs
          path: docker-logs/
          retention-days: 30

      - name: Stop stack
        if: always()
        run: docker compose down -v
