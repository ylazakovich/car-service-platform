name: PR Pipeline

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# Same PR = one group. Do not cancel in-progress runs: canceling mid-run drops some job artifacts;
# merged Allure would miss suites from jobs that had not finished uploading (misleading report).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # upload-artifact (Allure, JUnit, Playwright HTML)

jobs:
  datafaker-generator:
    name: "Datafaker Generator: Build, Checkstyle, SpotBugs & Test"
    runs-on: ubuntu-latest
    env:
      CI: "true"
    defaults:
      run:
        working-directory: tools/datafaker-generator

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: quokkify/project-toolkit/actions/setup-java-gradle@68f36f489e423e51ffbd9ad1d8ba42795c50aa5f # v1.1.1
        with:
          java-version: "21"
          distribution: temurin
          working-directory: tools/datafaker-generator
          cache-dependencies: "true"
          validate-wrappers: "true"

      - name: Compile, lint, test and install distribution
        run: ./gradlew check installDist --no-daemon --console=plain --stacktrace

      - name: Smoke run generator CLI
        run: |
          mkdir -p ../../tmp
          build/install/csp-demo-data/bin/csp-demo-data generate datafaker-demo \
            --seed 123 \
            --locale en-US \
            --count 5 \
            --profile demo \
            --output ../../tmp/datafaker-demo-ci.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: datafaker-generator-reports
          retention-days: 14
          path: |
            tools/datafaker-generator/build/reports/checkstyle
            tools/datafaker-generator/build/reports/spotbugs
            tools/datafaker-generator/build/test-results
            tools/datafaker-generator/build/reports/tests

  frontend:
    name: "Frontend: Build & Test"
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: quokkify/project-toolkit/actions/setup-node@9df6d8f96fc0f2f1ed4b48ba335e5ebe1167e9eb # v1.0.0
        with:
          node-version: "24"
          working-directory: frontend

      - name: Build
        run: npm run build

      - name: Run tests
        run: npx vitest run --exclude src/pages/ClientPortalPage.status.test.tsx

      - name: Allure CI env fragment (frontend)
        if: always()
        run: bash ../scripts/ci/write-allure-ci-env-fragment.sh Frontend allure-results
        working-directory: frontend

      - uses: quokkify/project-toolkit/actions/junit-step-summary@1b27865ceadc184db557e9bddc34f3c176176795 # v2.1.0
        if: always()
        with:
          working-directory: frontend
          junit-paths: test-results/junit.xml
          title: Frontend Tests
          fail-on-missing: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-test-results
          path: frontend/test-results/
          retention-days: 30

      - name: Upload Allure results (frontend)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allure-results-frontend
          path: frontend/allure-results/
          if-no-files-found: ignore
          retention-days: 30

  frontend-portal-status:
    name: "Frontend: Client Portal Status Suite"
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: quokkify/project-toolkit/actions/setup-node@9df6d8f96fc0f2f1ed4b48ba335e5ebe1167e9eb # v1.0.0
        with:
          node-version: "24"
          working-directory: frontend

      - name: Run client portal status suite
        run: npm run test:portal-status

      - name: Allure CI env fragment (client portal status)
        if: always()
        run: bash ../scripts/ci/write-allure-ci-env-fragment.sh "Client Portal Status" allure-results
        working-directory: frontend

      - uses: quokkify/project-toolkit/actions/junit-step-summary@1b27865ceadc184db557e9bddc34f3c176176795 # v2.1.0
        if: always()
        with:
          working-directory: frontend
          junit-paths: test-results/junit.xml
          title: Client Portal Status Tests
          fail-on-missing: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-portal-status-test-results
          path: frontend/test-results/
          retention-days: 30

      - name: Upload Allure results (client portal status)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allure-results-frontend-portal-status
          path: frontend/allure-results/
          if-no-files-found: ignore
          retention-days: 30

  backend:
    name: "Backend: Build & Test"
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: quokkify/project-toolkit/actions/setup-python@f988361ce9f0cb7c230d2f7d3276b3b6fe4b68d2 # v1.1.0
        with:
          python-version: "3.14"
          working-directory: backend
          package-manager: pip
          requirements-file: requirements-test.txt

      - name: Install OCR (Tesseract + Poppler for CI)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-pol

      - name: Check for missing migrations
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          TEST_OUTPUT_DIR: test-results
        run: |
          mkdir -p allure-results test-results
          pytest --alluredir=allure-results --junitxml=test-results/junit.xml -v

      - name: Allure CI env fragment (backend)
        if: always()
        run: bash ../scripts/ci/write-allure-ci-env-fragment.sh Backend allure-results
        working-directory: backend

      - uses: quokkify/project-toolkit/actions/junit-step-summary@1b27865ceadc184db557e9bddc34f3c176176795 # v2.1.0
        if: always()
        with:
          working-directory: backend
          junit-paths: test-results/*.xml
          title: Backend Tests
          fail-on-missing: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-results
          path: backend/test-results/
          retention-days: 30

      - name: Upload Allure results (backend)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allure-results-backend
          path: backend/allure-results/
          if-no-files-found: ignore
          retention-days: 30

  e2e:
    name: "End-to-end: ${{ matrix.title }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: app
            title: App
            allure-label: E2E App
            command: PLAYWRIGHT_E2E_SUITE=app npx playwright test
          - id: django-admin
            title: Django Admin
            allure-label: E2E Django Admin
            command: PLAYWRIGHT_E2E_SUITE=django-admin npx playwright test
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      E2E_ADMIN_EMAIL: admin@autoservice.local
      E2E_ADMIN_PASSWORD: admin12345
      E2E_STAFF_EMAIL: staff@autoservice.local
      E2E_STAFF_PASSWORD: staff12345
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: quokkify/project-toolkit/actions/setup-node@9df6d8f96fc0f2f1ed4b48ba335e5ebe1167e9eb # v1.0.0
        with:
          node-version: "24"
          working-directory: frontend

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Prepare CSP Compose env
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          perl -0pi -e 's/^LOG_FORMAT=text$/LOG_FORMAT=json/m; s/^LOG_LEVEL=DEBUG$/LOG_LEVEL=INFO/m' .env

      - uses: quokkify/project-toolkit/actions/compose-up@cca33fbcc71864f2a08d7309cb17f93b1efd0c26 # v2.0.0
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        with:
          compose-files: |
            docker-compose.yml
            ${{ github.event.pull_request.head.repo.full_name == github.repository && 'docker-compose.ci.cache.yml' || '' }}
          services: db backend frontend
          build: "true"
          wait-for-health: "true"
          wait-urls: http://127.0.0.1:4173/
          timeout-seconds: "180"

      - name: Wait for API health body
        shell: bash
        run: bash scripts/ci/wait-for-api-health-body.sh http://127.0.0.1:4173/api/health

      - name: Run Playwright (${{ matrix.title }})
        env:
          DOCKER_STATS_INTERVAL: "5"
          DOCKER_STATS_LOG: ${{ github.workspace }}/docker-metrics/samples.tsv
        run: |
          set -euo pipefail
          mkdir -p docker-metrics frontend/allure-results frontend/test-results
          bash scripts/ci/e2e-docker-stats-sampler.sh &
          SAMPLER_PID=$!
          cleanup() {
            kill "$SAMPLER_PID" 2>/dev/null || true
            wait "$SAMPLER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM
          ( cd frontend && ${{ matrix.command }} )
          cleanup
          trap - EXIT INT TERM

      - name: Docker container resource summary (E2E ${{ matrix.title }} window)
        if: always()
        env:
          DOCKER_METRICS_DIR: ${{ github.workspace }}/docker-metrics
          DOCKER_STATS_LOG: ${{ github.workspace }}/docker-metrics/samples.tsv
          DOCKER_STATS_INTERVAL: "5"
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_REF: ${{ github.ref }}
        run: bash scripts/ci/e2e-docker-stats-summarize.sh

      - uses: quokkify/project-toolkit/actions/junit-step-summary@1b27865ceadc184db557e9bddc34f3c176176795 # v2.1.0
        if: always()
        with:
          working-directory: frontend
          junit-paths: test-results/e2e-junit.xml
          title: "End-to-end: ${{ matrix.title }}"
          fail-on-missing: "true"

      - name: Allure CI env fragment (E2E ${{ matrix.title }})
        if: always()
        run: bash scripts/ci/write-allure-ci-env-fragment.sh "${{ matrix.allure-label }}" frontend/allure-results

      - name: Upload Allure results (E2E ${{ matrix.title }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allure-results-e2e-${{ matrix.id }}
          path: frontend/allure-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright HTML report (${{ matrix.title }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.id }}
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload E2E JUnit (Playwright ${{ matrix.title }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-test-results-${{ matrix.id }}
          path: frontend/test-results/e2e-junit.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Collect Docker logs
        if: always()
        run: |
          mkdir -p docker-logs
          for service in backend frontend db; do
            container_id=$(docker compose ps -q "$service" 2>/dev/null || true)
            if [ -n "$container_id" ]; then
              docker logs "$container_id" > "docker-logs/${service}.log" 2>&1 || true
            fi
          done

      - name: Upload Docker logs (${{ matrix.title }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-logs-${{ matrix.id }}
          path: docker-logs/
          retention-days: 30

      - name: Upload Docker resource metrics (E2E ${{ matrix.title }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-resource-metrics-e2e-${{ matrix.id }}
          path: docker-metrics/
          if-no-files-found: ignore
          retention-days: 90

      - name: Stop stack
        if: always()
        run: docker compose down -v
