name: PR Pipeline

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# Same PR = one group. Do not cancel in-progress runs: canceling mid-run drops some job artifacts;
# merged Allure would miss suites from jobs that had not finished uploading (misleading report).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # upload-artifact (Allure, JUnit, Playwright HTML)

jobs:
  frontend:
    name: "Frontend: Build & Test"
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-node

      - name: Build
        run: npm run build

      - name: Run tests
        run: npx vitest run

      - name: Allure CI env fragment (frontend)
        if: always()
        run: bash ../scripts/ci/write-allure-ci-env-fragment.sh Frontend allure-results
        working-directory: frontend

      - name: Test summary
        if: always()
        run: |
          if [ -f test-results/junit.xml ]; then
            tests=$(grep -o 'tests="[0-9]*"' test-results/junit.xml | head -1 | grep -o '[0-9]*')
            failures=$(grep -o 'failures="[0-9]*"' test-results/junit.xml | head -1 | grep -o '[0-9]*')
            time=$(grep -o 'time="[0-9.]*"' test-results/junit.xml | head -1 | grep -o '[0-9.]*')
            passed=$((${tests:-0} - ${failures:-0}))
            if [ "${failures:-0}" = "0" ]; then
              echo "### Frontend Tests" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### Frontend Tests (failures)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "| Tests | Passed | Failed | Duration |" >> "$GITHUB_STEP_SUMMARY"
            echo "|-------|--------|--------|----------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| ${tests:-0} | ${passed} | ${failures:-0} | ${time:-?}s |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: frontend-test-results
          path: frontend/test-results/
          retention-days: 30

      - name: Upload Allure results (frontend)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: allure-results-frontend
          path: frontend/allure-results/
          if-no-files-found: ignore
          retention-days: 30

  backend:
    name: "Backend: Build & Test"
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements-test.txt

      - name: Check for missing migrations
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          TEST_OUTPUT_DIR: test-results
        run: |
          mkdir -p allure-results test-results
          pytest --alluredir=allure-results --junitxml=test-results/junit.xml -v

      - name: Allure CI env fragment (backend)
        if: always()
        run: bash ../scripts/ci/write-allure-ci-env-fragment.sh Backend allure-results
        working-directory: backend

      - name: Test summary
        if: always()
        run: |
          total=0
          failures=0
          errors=0
          for xml in test-results/*.xml; do
            [ -f "$xml" ] || continue
            t=$(grep -o 'tests="[0-9]*"' "$xml" | head -1 | grep -o '[0-9]*')
            f=$(grep -o 'failures="[0-9]*"' "$xml" | head -1 | grep -o '[0-9]*')
            e=$(grep -o 'errors="[0-9]*"' "$xml" | head -1 | grep -o '[0-9]*')
            total=$((total + ${t:-0}))
            failures=$((failures + ${f:-0}))
            errors=$((errors + ${e:-0}))
          done
          failed=$((failures + errors))
          passed=$((total - failed))
          if [ "$failed" = "0" ]; then
            echo "### Backend Tests" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Backend Tests (failures)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Tests | Passed | Failed | Errors |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ${total} | ${passed} | ${failures} | ${errors} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: backend-test-results
          path: backend/test-results/
          retention-days: 30

      - name: Upload Allure results (backend)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: allure-results-backend
          path: backend/allure-results/
          if-no-files-found: ignore
          retention-days: 30

  e2e:
    name: "E2E: Playwright + Allure"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      E2E_ADMIN_EMAIL: admin@autoservice.local
      E2E_ADMIN_PASSWORD: change-me-in-production
      E2E_STAFF_EMAIL: staff@autoservice.local
      E2E_STAFF_PASSWORD: change-me-in-production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-node

      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - uses: ./.github/actions/compose-up
        with:
          env-profile: json-info
          wait-for-frontend: "true"
          # Fork PRs: token is read-only — GHA cache backend needs actions: write
          github-actions-cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'true' || 'false' }}

      - name: Run Playwright
        working-directory: frontend
        run: |
          mkdir -p allure-results test-results
          npx playwright test

      - name: E2E test summary (JUnit)
        if: always()
        working-directory: frontend
        run: |
          if [ -f test-results/e2e-junit.xml ]; then
            tests=$(grep -o 'tests="[0-9]*"' test-results/e2e-junit.xml | head -1 | grep -o '[0-9]*')
            failures=$(grep -o 'failures="[0-9]*"' test-results/e2e-junit.xml | head -1 | grep -o '[0-9]*')
            skipped=$(grep -o 'skipped="[0-9]*"' test-results/e2e-junit.xml | head -1 | grep -o '[0-9]*')
            time=$(grep -o 'time="[0-9.]*"' test-results/e2e-junit.xml | head -1 | grep -o '[0-9.]*')
            passed=$((${tests:-0} - ${failures:-0} - ${skipped:-0}))
            if [ "${failures:-0}" = "0" ]; then
              echo "### E2E (Playwright)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### E2E (Playwright) (failures)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "| Tests | Passed | Failed | Skipped | Duration |" >> "$GITHUB_STEP_SUMMARY"
            echo "|-------|--------|--------|---------|----------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| ${tests:-0} | ${passed} | ${failures:-0} | ${skipped:-0} | ${time:-?}s |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Allure CI env fragment (E2E)
        if: always()
        run: bash scripts/ci/write-allure-ci-env-fragment.sh E2E frontend/allure-results

      - name: Upload Allure results (E2E)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: allure-results-e2e
          path: frontend/allure-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload E2E JUnit (Playwright)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: e2e-test-results
          path: frontend/test-results/e2e-junit.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Collect Docker logs
        if: always()
        run: |
          mkdir -p docker-logs
          for service in backend frontend db; do
            container_id=$(docker compose ps -q "$service" 2>/dev/null || true)
            if [ -n "$container_id" ]; then
              docker logs "$container_id" > "docker-logs/${service}.log" 2>&1 || true
            fi
          done

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: docker-logs
          path: docker-logs/
          retention-days: 30

      - name: Stop stack
        if: always()
        run: docker compose down -v
