name: PR Pipeline

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# Same PR = one group. Do not cancel in-progress runs: canceling mid-run drops some job artifacts;
# merged Allure would miss suites from jobs that had not finished uploading (misleading report).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # upload-artifact (Allure, JUnit, Playwright HTML)

jobs:
  frontend:
    name: "Frontend: Build & Test"
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-node

      - name: Build
        run: npm run build

      - name: Run tests
        run: npx vitest run

      - name: Allure CI env fragment (frontend)
        if: always()
        run: bash ../scripts/ci/write-allure-ci-env-fragment.sh Frontend allure-results
        working-directory: frontend

      - uses: ./.github/actions/junit-step-summary
        if: always()
        with:
          cwd: frontend
          variant: frontend-single
          title: Frontend Tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-test-results
          path: frontend/test-results/
          retention-days: 30

      - name: Upload Allure results (frontend)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allure-results-frontend
          path: frontend/allure-results/
          if-no-files-found: ignore
          retention-days: 30

  backend:
    name: "Backend: Build & Test"
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-python
        with:
          requirements: requirements-test.txt

      - name: Install OCR (Tesseract + Poppler for CI)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-pol

      - name: Check for missing migrations
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          TEST_OUTPUT_DIR: test-results
        run: |
          mkdir -p allure-results test-results
          pytest --alluredir=allure-results --junitxml=test-results/junit.xml -v

      - name: Allure CI env fragment (backend)
        if: always()
        run: bash ../scripts/ci/write-allure-ci-env-fragment.sh Backend allure-results
        working-directory: backend

      - uses: ./.github/actions/junit-step-summary
        if: always()
        with:
          cwd: backend
          variant: backend-pytest
          title: Backend Tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-results
          path: backend/test-results/
          retention-days: 30

      - name: Upload Allure results (backend)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allure-results-backend
          path: backend/allure-results/
          if-no-files-found: ignore
          retention-days: 30

  e2e:
    name: "End-to-end"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      E2E_ADMIN_EMAIL: admin@autoservice.local
      E2E_ADMIN_PASSWORD: admin12345
      E2E_STAFF_EMAIL: staff@autoservice.local
      E2E_STAFF_PASSWORD: staff12345
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-node

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - uses: ./.github/actions/compose-up
        with:
          env-profile: json-info
          wait-for-frontend: "true"
          wait-for-api-health: "true"
          api-health-url: "http://127.0.0.1:4173/api/health"
          # Fork PRs: token is read-only — GHA cache backend needs actions: write
          github-actions-cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'true' || 'false' }}

      - name: Load demo data for E2E
        run: |
          set -euo pipefail
          set -a
          # compose-up copies .env from .env.example
          [ -f .env ] && source .env
          set +a
          docker compose exec -T db psql \
            -v ON_ERROR_STOP=1 \
            -U "${POSTGRES_USER:-car_service_platform}" \
            -d "${POSTGRES_DB:-car_service_platform}" \
            < scripts/demo/demo_data.sql
          docker compose exec -T backend python manage.py seed_e2e_pdf_documents

      - name: Run Playwright
        env:
          DOCKER_STATS_INTERVAL: "5"
          DOCKER_STATS_LOG: ${{ github.workspace }}/docker-metrics/samples.tsv
        run: |
          set -euo pipefail
          mkdir -p docker-metrics frontend/allure-results frontend/test-results
          bash scripts/ci/e2e-docker-stats-sampler.sh &
          SAMPLER_PID=$!
          cleanup() {
            kill "$SAMPLER_PID" 2>/dev/null || true
            wait "$SAMPLER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM
          ( cd frontend && npx playwright test )
          cleanup
          trap - EXIT INT TERM

      - name: Docker container resource summary (E2E window)
        if: always()
        env:
          DOCKER_METRICS_DIR: ${{ github.workspace }}/docker-metrics
          DOCKER_STATS_LOG: ${{ github.workspace }}/docker-metrics/samples.tsv
          DOCKER_STATS_INTERVAL: "5"
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_REF: ${{ github.ref }}
        run: bash scripts/ci/e2e-docker-stats-summarize.sh

      - uses: ./.github/actions/junit-step-summary
        if: always()
        with:
          cwd: frontend
          variant: e2e-playwright
          title: End-to-end

      - name: Allure CI env fragment (E2E)
        if: always()
        run: bash scripts/ci/write-allure-ci-env-fragment.sh E2E frontend/allure-results

      - name: Upload Allure results (E2E)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allure-results-e2e
          path: frontend/allure-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload E2E JUnit (Playwright)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-test-results
          path: frontend/test-results/e2e-junit.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Collect Docker logs
        if: always()
        run: |
          mkdir -p docker-logs
          for service in backend frontend db; do
            container_id=$(docker compose ps -q "$service" 2>/dev/null || true)
            if [ -n "$container_id" ]; then
              docker logs "$container_id" > "docker-logs/${service}.log" 2>&1 || true
            fi
          done

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-logs
          path: docker-logs/
          retention-days: 30

      - name: Upload Docker resource metrics (E2E)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-resource-metrics-e2e
          path: docker-metrics/
          if-no-files-found: ignore
          retention-days: 90

      - name: Stop stack
        if: always()
        run: docker compose down -v
