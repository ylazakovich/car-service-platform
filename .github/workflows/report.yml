name: Test Report

on:
  workflow_run:
    workflows: ["PR Pipeline"]
    types: [completed]

# Same head branch → newer PR Pipeline completion cancels an in-progress Test Report (one deploy at a time per branch).
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.workflow_run.head_repository.full_name || github.repository
    }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: write # deploy-gh-pages-subdir pushes the gh-pages branch
  checks: write
  pull-requests: write
  actions: write

jobs:
  test-report:
    name: Test Report
    # Cancelled PR Pipeline often has no E2E artifacts → partial Allure (e.g. 144 = unit+api only).
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node
        with:
          install-dependencies: "false"

      # workflow_run.pull_requests is often empty (forks, timing). Fall back: commit → PR (gh api).
      - name: Resolve PR number (GitHub Pages path)
        id: pr_ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_PULLS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(node -e "const a=JSON.parse(process.env.PR_PULLS_JSON||'[]'); process.stdout.write(String(a[0]?.number??''))")"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" -q '.[0].number // empty' 2>/dev/null || true)"
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if [ -n "$PR_NUMBER" ]; then echo "has_pr=true" >> "$GITHUB_OUTPUT"; else echo "has_pr=false" >> "$GITHUB_OUTPUT"; fi

      - name: Detect fork PR (no Pages preview for cross-repo)
        id: fork
        env:
          HEAD_FULL: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          REPO="${{ github.repository }}"
          if [ -z "$HEAD_FULL" ] || [ "$HEAD_FULL" = "$REPO" ]; then
            echo "fork=false" >> "$GITHUB_OUTPUT"
          else
            echo "fork=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts from PR Pipeline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Debug — Allure artifact layout
        run: |
          echo "workflow_run conclusion=${{ github.event.workflow_run.conclusion }}"
          shopt -s nullglob
          dirs=(artifacts/allure-results-*)
          if ((${#dirs[@]} == 0)); then
            echo "No allure-results-* artifact directories found"
          fi
          for d in "${dirs[@]}"; do
            n=$(find "$d" -maxdepth 3 -name '*-result.json' 2>/dev/null | wc -l | tr -d ' ')
            echo "$(basename "$d"): *-result.json count=$n"
          done
          shopt -u nullglob

      # hashFiles() follows .gitignore; repo root ignores artifacts/ → conditions were always false on GitHub.
      - name: Probe downloaded JUnit paths
        id: junit_paths
        run: |
          fr="false"
          be="false"
          e2e="false"
          [ -f artifacts/frontend-test-results/junit.xml ] && fr="true"
          shopt -s nullglob
          be_xml=(artifacts/backend-test-results/*.xml)
          e2e_xml=(artifacts/e2e-test-results-*/e2e-junit.xml artifacts/e2e-test-results/e2e-junit.xml)
          ((${#be_xml[@]})) && be="true"
          ((${#e2e_xml[@]})) && e2e="true"
          shopt -u nullglob
          echo "frontend=$fr" >> "$GITHUB_OUTPUT"
          echo "backend=$be" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "Probe: frontend=$fr backend=$be e2e=$e2e"

      # dorny/test-reporter: reporter "java-junit" = JUnit XML (Vitest, pytest, xmlrunner, etc.), not a Java stack.
      # fail-on-error: false — иначе при любом упавшем тесте шаг падает и job не доходит до Merge Allure / gh-pages / комментария в PR.
      # Итог провала по-прежнему виден в созданном check run у test-reporter и в Allure.
      - name: Frontend Test Report
        if: steps.junit_paths.outputs.frontend == 'true'
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Frontend Tests
          path: artifacts/frontend-test-results/junit.xml
          reporter: java-junit
          fail-on-error: "false"

      - name: Backend Test Report
        if: steps.junit_paths.outputs.backend == 'true'
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Backend Tests
          path: artifacts/backend-test-results/*.xml
          reporter: java-junit
          fail-on-error: "false"

      - name: E2E (Playwright) Test Report
        if: steps.junit_paths.outputs.e2e == 'true'
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: E2E (Playwright)
          path: artifacts/e2e-test-results-*/e2e-junit.xml,artifacts/e2e-test-results/e2e-junit.xml
          reporter: java-junit
          fail-on-error: "false"

      # PR Pipeline uploads one Allure result artifact per CI job/matrix shard; merge without clobbering environment fragments.
      - name: Merge Allure results
        id: allure
        run: |
          bash scripts/ci/merge-allure-result-dirs.sh \
            "${{ github.workspace }}/artifacts/allure-results" \
            "${{ github.workspace }}/artifacts/_merged_ci_env.properties" \
            "${{ github.workspace }}/artifacts/allure-results-frontend" \
            "${{ github.workspace }}/artifacts/allure-results-frontend-portal-status" \
            "${{ github.workspace }}/artifacts/allure-results-backend" \
            "${{ github.workspace }}/artifacts/allure-results-e2e-app" \
            "${{ github.workspace }}/artifacts/allure-results-e2e-django-admin" \
            "${{ github.workspace }}/artifacts/allure-results-e2e"
          if compgen -G 'artifacts/allure-results/*-result.json' > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python (Django version for Allure environment.properties)
        if: steps.allure.outputs.present == 'true'
        uses: ./.github/actions/setup-python
        with:
          requirements: requirements-test.txt

      - name: Write Allure environment.properties
        if: steps.allure.outputs.present == 'true'
        env:
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/artifacts/allure-results
          ALLURE_VARIABLES_JSON: ${{ github.workspace }}/artifacts/allure-variables.json
          ALLURE_MERGED_CI_ENV: ${{ github.workspace }}/artifacts/_merged_ci_env.properties
          REPO_ROOT: ${{ github.workspace }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REF_NAME: ${{ github.event.workflow_run.head_branch }}
          ALLURE_GITHUB_WORKFLOW: ${{ github.event.workflow_run.name }}
          ALLURE_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash scripts/ci/write-allure-environment.sh

      - name: Generate Allure HTML, badges, PR comment markdown
        if: steps.allure.outputs.present == 'true'
        env:
          PR_NUMBER: ${{ steps.pr_ctx.outputs.number }}
          FORK_PR: ${{ steps.fork.outputs.fork }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          cp -f .github/allure/categories.json artifacts/allure-results/categories.json
          # Allure Report CLI: версия — renovate.json (alias allure-cli → npm:allure, customManagers regex).
          npx --yes allure@3.14.1 generate artifacts/allure-results -o allure-report --config scripts/allure/allurerc.mjs
          node .github/scripts/allure-ci.mjs badges --results artifacts/allure-results --out allure-report
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          PAGES_URL=""
          if [ -n "$PR_NUMBER" ]; then
            # Query string busts browser/CDN cache for GitHub Pages (same path per PR otherwise looks "stale").
            PAGES_URL="https://${OWNER}.github.io/${REPO}/allure/pr-${PR_NUMBER}/?run=${SOURCE_RUN_ID}"
          fi
          node .github/scripts/allure-ci.mjs pr-body \
            --results artifacts/allure-results \
            --report allure-report \
            --output allure-pr-comment.md \
            --pages-url "$PAGES_URL" \
            --fork-pr "$FORK_PR" \
            --source-run-id "${SOURCE_RUN_ID}"

      - name: Export test pyramid snapshot (Allure epics)
        if: steps.allure.outputs.present == 'true'
        env:
          PYRAMID_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          PYRAMID_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node .github/scripts/allure-ci.mjs pyramid \
            --results artifacts/allure-results \
            --output docs/testing/pyramid-snapshot.md \
            --json docs/testing/pyramid-snapshot.json

      - name: Quality gates — test pyramid (advisory warnings only)
        if: steps.allure.outputs.present == 'true'
        run: |
          node .github/scripts/allure-ci.mjs pyramid-check \
            --results artifacts/allure-results \
            --json docs/testing/pyramid-quality-gates.json

      - name: Upload pyramid snapshot artifact
        if: steps.allure.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pyramid-snapshot
          path: |
            docs/testing/pyramid-snapshot.md
            docs/testing/pyramid-snapshot.json
            docs/testing/pyramid-quality-gates.json
          retention-days: 30

      # Per-PR folder on gh-pages: allure/pr-<N>/ — rsync --delete only that subdir; other PR folders stay intact.
      - name: Deploy Allure HTML to GitHub Pages
        if: ${{ steps.allure.outputs.present == 'true' && steps.pr_ctx.outputs.has_pr == 'true' && steps.fork.outputs.fork == 'false' }}
        uses: ./.github/actions/deploy-gh-pages-subdir
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: allure/pr-${{ steps.pr_ctx.outputs.number }}

      - name: Post or update Allure comment on PR
        if: steps.allure.outputs.present == 'true'
        env:
          PR_NUMBER_RESOLVED: ${{ steps.pr_ctx.outputs.number }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const issue_number = parseInt(process.env.PR_NUMBER_RESOLVED || '', 10);
            if (!issue_number) {
              core.info('No PR number (workflow_run.pull_requests empty and no commit→PR match); skip Allure PR comment.');
              return;
            }
            const marker = '<!-- csp-allure-ci -->';
            const body = fs.readFileSync('allure-pr-comment.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find(
              (c) =>
                c.user?.login === 'github-actions[bot]' &&
                (c.body || '').includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
            }

      # После публикации отчётов: сохранить красный статус workflow, если PR Pipeline не success (отдельно от fail-on-error в test-reporter).
      - name: Mirror PR Pipeline conclusion
        if: always()
        run: |
          case '${{ github.event.workflow_run.conclusion }}' in
            success) exit 0 ;;
            *)
              echo "::error::PR Pipeline ended as ${{ github.event.workflow_run.conclusion }}. Allure/JUnit steps above still ran; see PR comment, Checks tab, and artifacts on the source run (e.g. playwright-report from End-to-end job)."
              exit 1
              ;;
          esac
