name: Test Report

on:
  workflow_run:
    workflows: ["PR Pipeline"]
    types: [completed]

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

jobs:
  test-report:
    name: Test Report
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download artifacts from PR Pipeline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Frontend Test Report
        if: ${{ hashFiles('artifacts/frontend-test-results/junit.xml') != '' }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Frontend Tests
          path: artifacts/frontend-test-results/junit.xml
          reporter: java-junit

      - name: Backend Test Report
        if: ${{ hashFiles('artifacts/backend-test-results/*.xml') != '' }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Backend Tests
          path: artifacts/backend-test-results/*.xml
          reporter: java-junit
