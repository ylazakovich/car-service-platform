name: Main Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# Same ref = same group → new push to main cancels an in-progress run (sha-based groups never cancel).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  datafaker-generator:
    name: "Datafaker Generator: Build"
    runs-on: ubuntu-latest
    env:
      CI: "true"
    defaults:
      run:
        working-directory: tools/datafaker-generator

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: ylazakovich/project-toolkit/actions/setup-java-gradle@68f36f489e423e51ffbd9ad1d8ba42795c50aa5f # v1.1.1
        with:
          java-version: "21"
          distribution: temurin
          working-directory: tools/datafaker-generator
          cache-dependencies: "true"
          validate-wrappers: "true"

      - name: Compile, lint, test and install distribution
        run: ./gradlew check installDist --no-daemon --console=plain --stacktrace

      - name: Smoke run generator CLI
        run: |
          mkdir -p ../../tmp
          build/install/csp-demo-data/bin/csp-demo-data generate datafaker-demo \
            --seed 123 \
            --locale en-US \
            --count 5 \
            --profile demo \
            --output ../../tmp/datafaker-demo-ci.json

  frontend-build:
    name: "Frontend: Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: ylazakovich/project-toolkit/actions/setup-node@9df6d8f96fc0f2f1ed4b48ba335e5ebe1167e9eb # v1.0.0
        with:
          node-version: "24"
          working-directory: frontend

      - name: Build
        run: npm run build

  backend-build:
    name: "Backend: Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: ylazakovich/project-toolkit/actions/setup-python@f988361ce9f0cb7c230d2f7d3276b3b6fe4b68d2 # v1.1.0
        with:
          python-version: "3.14"
          working-directory: backend
          package-manager: pip
          requirements-file: requirements.txt

      - name: System check
        env:
          DJANGO_SECRET_KEY: ci-build-secret-key
        run: python manage.py check --settings=config.settings_test

      - name: Check for missing migrations
        env:
          DJANGO_SECRET_KEY: ci-build-secret-key
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

  docker:
    name: "Docker: Build & Health"
    runs-on: ubuntu-latest
    needs: [datafaker-generator, frontend-build, backend-build]
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write # GHA BuildKit cache (docker-compose.ci.cache.yml)

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Prepare CSP Compose env
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          perl -0pi -e 's/^LOG_FORMAT=text$/LOG_FORMAT=json/m; s/^LOG_LEVEL=DEBUG$/LOG_LEVEL=INFO/m' .env

      - uses: ylazakovich/project-toolkit/actions/compose-up@cca33fbcc71864f2a08d7309cb17f93b1efd0c26 # v2.0.0
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        with:
          compose-files: |
            docker-compose.yml
            docker-compose.ci.cache.yml
          services: db backend frontend
          build: "true"
          wait-for-health: "true"
          timeout-seconds: "180"

      - name: Show container status
        run: docker compose ps

      - name: Stop containers
        if: always()
        run: docker compose down -v
