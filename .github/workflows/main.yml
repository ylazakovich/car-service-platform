name: Main Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# Same ref = same group → new push to main cancels an in-progress run (sha-based groups never cancel).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  datafaker-generator:
    name: "Datafaker Generator: Build"
    runs-on: ubuntu-latest
    env:
      CI: "true"
    defaults:
      run:
        working-directory: tools/datafaker-generator

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-java-gradle

      - name: Compile, lint, test and install distribution
        run: ./gradlew check installDist --no-daemon --console=plain --stacktrace

      - name: Smoke run generator CLI
        run: |
          mkdir -p ../../tmp
          build/install/csp-demo-data/bin/csp-demo-data generate datafaker-demo \
            --seed 123 \
            --locale en-US \
            --count 5 \
            --profile demo \
            --output ../../tmp/datafaker-demo-ci.json

  frontend-build:
    name: "Frontend: Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-node

      - name: Build
        run: npm run build

  backend-build:
    name: "Backend: Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-python

      - name: System check
        env:
          DJANGO_SECRET_KEY: ci-build-secret-key
        run: python manage.py check --settings=config.settings_test

      - name: Check for missing migrations
        env:
          DJANGO_SECRET_KEY: ci-build-secret-key
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

  docker:
    name: "Docker: Build & Health"
    runs-on: ubuntu-latest
    needs: [datafaker-generator, frontend-build, backend-build]
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write # GHA BuildKit cache (docker-compose.ci.cache.yml)

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/compose-up
        with:
          env-profile: json-info
          github-actions-cache: "true"

      - name: Show container status
        run: docker compose ps

      - name: Stop containers
        if: always()
        run: docker compose down -v
