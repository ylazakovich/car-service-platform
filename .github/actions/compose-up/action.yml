name: Compose up (CI stack)
description: Prepare .env from .env.example and run docker compose up -d --build; optional wait for frontend; optional GHA BuildKit cache.

inputs:
  env-profile:
    description: "default = copy .env.example only; json-info = also set LOG_FORMAT=json and LOG_LEVEL=INFO (Docker log artifact jobs)"
    required: false
    default: default
  wait-for-frontend:
    description: "If true, poll until the frontend URL responds (Playwright / E2E)"
    required: false
    default: "false"
  frontend-health-url:
    description: URL checked when wait-for-frontend is true
    required: false
    default: "http://127.0.0.1:4173/"
  wait-for-api-health:
    description: "If true, poll GET api-health-url until 200 (same origin as Playwright — nginx /api → backend)"
    required: false
    default: "false"
  api-health-url:
    description: Full URL for backend health via frontend proxy (must match PLAYWRIGHT_BASE_URL origin)
    required: false
    default: "http://127.0.0.1:4173/api/health"
  github-actions-cache:
    description: "If true, use docker/setup-buildx-action and docker-compose.ci.cache.yml (GHA cache backend; requires actions:write)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      if: ${{ inputs.github-actions-cache == 'true' }}
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Prepare .env
      shell: bash
      env:
        ENV_PROFILE: ${{ inputs.env-profile }}
      run: |
        set -euo pipefail
        if [ -f .env.example ]; then
          cp .env.example .env
          if [ "$ENV_PROFILE" = "json-info" ]; then
            sed -i 's/LOG_FORMAT=text/LOG_FORMAT=json/' .env || true
            sed -i 's/LOG_LEVEL=DEBUG/LOG_LEVEL=INFO/' .env || true
          fi
        fi

    - name: Build and start stack
      shell: bash
      env:
        DOCKER_BUILDKIT: 1
        COMPOSE_DOCKER_CLI_BUILD: 1
      run: |
        set -euo pipefail
        if [ "${{ inputs.github-actions-cache }}" = "true" ]; then
          docker compose -f docker-compose.yml -f docker-compose.ci.cache.yml up -d --build
        else
          docker compose up -d --build
        fi

    - name: Wait for frontend
      if: ${{ inputs.wait-for-frontend == 'true' }}
      shell: bash
      env:
        FRONTEND_HEALTH_URL: ${{ inputs.frontend-health-url }}
      run: |
        set -euo pipefail
        for i in $(seq 1 90); do
          if curl -sf "$FRONTEND_HEALTH_URL" >/dev/null; then
            echo "frontend healthy"
            exit 0
          fi
          sleep 2
        done
        docker compose logs --tail=120 || true
        exit 1

    - name: Wait for API health
      if: ${{ inputs.wait-for-api-health == 'true' }}
      shell: bash
      env:
        API_HEALTH_URL: ${{ inputs.api-health-url }}
      run: |
        set -euo pipefail
        for i in $(seq 1 90); do
          if curl -sf "$API_HEALTH_URL" | grep -q '"status"'; then
            echo "api health ok"
            exit 0
          fi
          sleep 2
        done
        echo "API health check failed: $API_HEALTH_URL"
        docker compose logs --tail=120 || true
        exit 1
