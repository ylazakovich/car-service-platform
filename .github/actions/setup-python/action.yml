name: Setup Python
description: Setup Python with pip cache and install dependencies.

inputs:
  python-version:
    description: Python version (major.minor or full); verified after install
    required: false
    default: "3.14"
  requirements:
    description: Path to requirements file relative to backend/
    required: false
    default: "requirements.txt"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: backend/${{ inputs.requirements }}

    - name: Install dependencies
      shell: bash
      working-directory: backend
      run: pip install -r ${{ inputs.requirements }}

    - name: Verify Python version
      shell: bash
      env:
        EXPECTED: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        python <<'PY'
        import os, sys

        exp = os.environ["EXPECTED"].strip()
        parts = exp.split(".")
        if len(parts) < 2:
            print("::error::python-version must be at least major.minor (e.g. 3.14)", file=sys.stderr)
            sys.exit(1)
        emaj, emin = int(parts[0]), int(parts[1])
        if (sys.version_info.major, sys.version_info.minor) != (emaj, emin):
            print(
                f"::error::Requested Python {exp} but interpreter is {sys.version.split()[0]}",
                file=sys.stderr,
            )
            sys.exit(1)
        print("Python OK:", sys.version.split()[0], f"(matches requested {exp})")
        PY
