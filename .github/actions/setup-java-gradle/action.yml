name: Setup Java and Gradle

description: Setup JDK 21 and Gradle cache for the Datafaker generator workflow.

author: car-service-platform

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6
