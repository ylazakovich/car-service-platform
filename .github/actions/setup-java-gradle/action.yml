name: Setup Java and Gradle

description: Setup JDK 21 and Gradle cache for the Datafaker generator workflow.

author: car-service-platform

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
