name: Setup Java and Gradle

description: Setup JDK 17 for the Datafaker generator workflow; Gradle runs via the wrapper.

author: car-service-platform

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
      with:
        distribution: temurin
        java-version: "17"
        cache: gradle
