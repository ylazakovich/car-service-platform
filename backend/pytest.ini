[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py *_tests.py tests_*.py
norecursedirs = .git .venv venv __pycache__ node_modules staticfiles
testpaths =
    repairs
    users
    vehicles
    uploads
    purchases
    customers
    services
    config
    foundation
addopts = -v --strict-markers --tb=short --color=yes
